image: debian:bookworm-slim

stages:
  - test

variables:
  DEBIAN_FRONTEND: noninteractive

before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends bash curl jq python3 shellcheck
  - rm -rf /var/lib/apt/lists/*

shellcheck:
  stage: test
  script:
    - find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

syntax:
  stage: test
  script:
    - find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

smoke:
  stage: test
  script:
    - bash tests/smoke.sh
